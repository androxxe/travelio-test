name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: Playwright + Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shelf
          POSTGRES_PASSWORD: shelf
          POSTGRES_DB: shelf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shelf -d shelf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://shelf:shelf@localhost:5432/shelf
      TEST_DATABASE_URL: postgres://shelf:shelf@localhost:5432/shelf
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Server tests against Postgres
        run: pnpm --filter @shelf/server test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker build + compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:3000/api/ready; then
              exit 0
            fi
            sleep 2
          done
          echo "app did not become ready" >&2
          exit 1
      - run: curl -fsS http://localhost:3000/ | grep -q "<title>Shelf"
      - run: curl -fsS http://localhost:3000/api/health
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
