# Temporary config for the first certificate issuance.
# Install this first, run certbot --webroot, then replace it with
# travelio.andriosirait.com.conf (the final TLS config).
server {
    listen 80;
    listen [::]:80;
    server_name travelio.andriosirait.com travelio-api.andriosirait.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://travelio.andriosirait.com$request_uri;
    }
}
