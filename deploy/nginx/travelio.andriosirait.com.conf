# Managed in the travelio-test repo. See spec/DEPLOY.md.
# HTTP is used only for ACME renewals; everything else redirects to the
# canonical app origin.
server {
    listen 80;
    listen [::]:80;
    server_name travelio.andriosirait.com travelio-api.andriosirait.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name travelio.andriosirait.com;

    ssl_certificate /etc/letsencrypt/live/travelio.andriosirait.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/travelio.andriosirait.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 2m;


    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

# API-only hostname: same container and database, no SPA. The root returns a
# small JSON descriptor and every non-API path is a 404. No CORS is configured
# because the SPA is same-origin; this hostname is for curl and integrations.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name travelio-api.andriosirait.com;

    ssl_certificate /etc/letsencrypt/live/travelio.andriosirait.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/travelio.andriosirait.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 2m;

    location = / {
        default_type application/json;
        return 200 '{"service":"shelf-api","health":"/api/health","search":"/api/books?q=dune","app":"https://travelio.andriosirait.com"}';
    }

    location = /api {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"API route not found"}}';
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"This host only serves /api"}}';
    }
}
