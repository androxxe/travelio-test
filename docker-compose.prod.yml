name: travelio-book-search

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shelf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: shelf
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelf -d shelf"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://shelf:${POSTGRES_PASSWORD}@db:5432/shelf
      CLIENT_DIST: /app/client
      MIGRATIONS_DIR: /app/migrations
      CLIENT_ORIGIN: https://travelio.andriosirait.com
      TRUST_PROXY: "true"
      RATE_LIMIT_MAX: 60
      FALLBACK_CATALOG_ENABLED: "true"
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  db-data:
